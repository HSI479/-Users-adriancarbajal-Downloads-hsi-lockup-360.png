<!doctype html><html><head><meta charset="utf-8"><title>4:19 thumbnail</title>
<link rel="stylesheet" href="brand.css">
<style>
body { width:1280px; height:720px; overflow:hidden; position:relative; background: var(--charcoal); }
.photo { position:absolute; top:0; bottom:0; right:0; width:560px; background:
  linear-gradient(90deg, var(--charcoal) 0%, rgba(28,27,24,0) 22%), linear-gradient(180deg, rgba(28,27,24,0) 60%, var(--charcoal) 100%),
  var(--photo, linear-gradient(160deg, #3a362e, #15140f)); background-size: cover; background-position: center; }
.photo .ph { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; color:#6b655a; font: 600 26px/1.2 var(--label); letter-spacing:.2em; padding-bottom:34px; }
.ep { position:absolute; left:64px; top:56px; font-family: var(--label); font-weight:700; font-size:34px; letter-spacing:.3em; color: var(--gold-light); }
.ep::before { content:""; display:inline-block; width:46px; height:4px; background: var(--gold-light); margin-right:18px; vertical-align:middle; }
.title { position:absolute; left:64px; top:150px; width:700px; font-family: var(--display); font-weight:800; font-size:128px; line-height:.92; letter-spacing:-2px; color: var(--bone); text-wrap: balance; }
.title em { font-style:normal; color: var(--gold-light); }
.sub { position:absolute; left:64px; bottom:140px; width:660px; font-family: var(--body); font-weight:600; font-size:38px; color: var(--stone); line-height:1.15; }
.sub b { color: var(--bone); font-weight:600; }
#logo { position:absolute; left:64px; bottom:34px; width:84px; height:84px; }
#logo svg, #logo img { width:100%; height:100%; }
.brand { position:absolute; left:166px; bottom:56px; font-family: var(--label); font-weight:600; font-size:24px; letter-spacing:.28em; color: var(--gold); }
/* concept B: verse / statement card (no photo) */
body.B .photo { display:none; }
body.B .title { width:1150px; font-size:156px; top:190px; }
body.B .sub { width:1100px; bottom:150px; }
/* concept C: group episode, photo band on the right 45% with a gold rule, 2 lines of names */
body.C .photo { width:600px; }
body.C .title { width:560px; font-size:112px; }
body.C .sub { width:560px; }
body.C .photo::after { content:""; position:absolute; left:0; top:80px; bottom:80px; width:4px; background: var(--gold-light); }
</style></head>
<body>
<div class="photo"><div class="ph">GUEST PHOTO</div></div>
<div class="ep" id="ep"></div>
<div class="title" id="title"></div>
<div class="sub" id="sub"></div>
<div id="logo"></div><div class="brand">4:19 PODCAST</div>
<script src="logo.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('concept') || 'A';
  document.getElementById('ep').textContent = q.get('ep') || 'EPISODE 1';
  document.getElementById('title').innerHTML = q.get('title') || 'Bold &amp; <em>Courageous</em>';
  document.getElementById('sub').innerHTML = q.get('sub') || 'with <b>Mark Carter</b>, The King’s Refuge';
  if (q.get('photo')) document.querySelector('.photo').style.setProperty('--photo', `url("${q.get('photo')}")`), document.querySelector('.ph').remove();
  mountLogo(document.getElementById('logo'));
</script>
</body></html>
